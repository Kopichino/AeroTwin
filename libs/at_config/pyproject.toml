[project]
name = "at-config"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/at_config"]

[tool.hatch.build.targets.wheel.force-include]
