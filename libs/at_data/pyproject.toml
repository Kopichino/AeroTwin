[project]
name = "at-data"
version = "0.1.0"
description = "C-MAPSS dataset acquisition, parsing and feature preparation"
requires-python = ">=3.12"
dependencies = ["at-core", "numpy>=2.0", "pandas>=2.2", "pyarrow>=17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/at_data"]
