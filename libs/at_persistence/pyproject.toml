[project]
name = "at-persistence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["at-core", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.14", "greenlet>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/at_persistence"]
