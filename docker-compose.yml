# AeroTwin demo stack.
#
#   docker compose up --build      then open http://localhost:8000/dashboard
#
# Single-container by default: the twin engine runs inside the API process using
# the in-memory bus, so the demo needs nothing else. Postgres and Redis are
# defined under the `full` profile for the multi-process topology:
#
#   docker compose --profile full up --build

name: aerotwin

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
    ports: ["8000:8000"]
    environment:
      AT_PROFILE: docker
      AT_LOG_JSON: "true"
      AT_TWIN_SUBSET: FD002
      AT_REPLAY_SPEED: "8"
      AT_TICK_HZ: "8"
      AT_INTERIM_DIR: /app/data/interim
      # Falls back to synthetic telemetry automatically when the dataset is
      # absent, so `docker compose up` works on a fresh clone.
      AT_TWIN_SYNTHETIC: "${AT_TWIN_SYNTHETIC:-false}"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    profiles: ["full"]
    environment:
      POSTGRES_USER: aerotwin
      POSTGRES_PASSWORD: aerotwin
      POSTGRES_DB: aerotwin
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerotwin"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    profiles: ["full"]
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
