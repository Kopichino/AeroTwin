[project]
name = "at-twin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["at-core", "at-config", "at-observability", "at-data", "at-persistence", "redis>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/at_twin"]
