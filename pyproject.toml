[project]
name = "aero-twin"
version = "0.1.0"
description = "Agentic Digital Twin Platform for Aircraft Engine Predictive Maintenance"
requires-python = ">=3.12"
dependencies = [
    "at-core",
    "at-config",
    "at-contracts",
    "at-observability",
    "at-bus",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
at-core = { workspace = true }
at-config = { workspace = true }
at-contracts = { workspace = true }
at-observability = { workspace = true }
at-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

# ─────────────────────────── tooling ───────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "models", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
# src-layout workspace: tell mypy where package roots live so a file is never
# resolved under two different module names.
mypy_path = [
    "libs/at_core/src",
    "libs/at_config/src",
    "libs/at_observability/src",
    "libs/at_contracts/src",
    "libs/at_bus/src",
    "libs/at_persistence/src",
    "libs/at_data/src",
    "libs/at_persistence/src",
    "services/api/src",
    "services/twin_engine/src",
    "services/inference/src",
    "services/agent_runtime/src",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["redis.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers --import-mode=importlib"
consider_namespace_packages = true
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff.lint.isort]
known-first-party = ["at_core", "at_config", "at_contracts", "at_observability", "at_bus", "at_persistence", "at_api", "at_twin", "at_inference", "at_agents"]
